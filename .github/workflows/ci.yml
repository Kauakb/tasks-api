name: CI

on:
  pull_request:
  push:
    branches: [develop]

# the CI token can only read the repo, even if the repo default changes
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest
        env:
          DB_PASSWORD: ci-not-used
      # fails if a pinned package has a known security vulnerability
      - name: pip-audit
        run: pip-audit -r requirements-dev.txt