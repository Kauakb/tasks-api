name: CI

on:
  pull_request:
  push:
    branches: [develop]

# the CI token can only read the repo, even if the repo default changes
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # a throwaway PostgreSQL for the tests, deleted when the job ends
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_api_test
        ports:
          - 5432:5432
        # wait until the database accepts connections before the steps run
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasks_api_test
      # fails if a pinned package has a known security vulnerability
      - name: pip-audit
        run: pip-audit -r requirements-dev.txt
